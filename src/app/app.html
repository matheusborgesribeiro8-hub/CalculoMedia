<div style="padding: 25px; font-family: Arial, sans-serif; max-width: 450px; margin: auto; border: 1px solid #ccc; border-radius: 8px; box-shadow: 2px 2px 12px rgba(0,0,0,0.1);">
  <h2 style="text-align: center; color: #333;">Cálculo de Média Escolar</h2>
  
  <!-- Campo Nome -->
  <div style="margin-bottom: 12px;">
    <label style="display: block; font-weight: bold; margin-bottom: 4px;">Nome do Aluno:</label>
    <input type="text" [(ngModel)]="nome" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  </div>

  <!-- Campo Nota 1 -->
  <div style="margin-bottom: 12px;">
    <label style="display: block; font-weight: bold; margin-bottom: 4px;">Nota 1:</label>
    <input type="number" [(ngModel)]="n1" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" min="0" max="10">
  </div>

  <!-- Campo Nota 2 -->
  <div style="margin-bottom: 12px;">
    <label style="display: block; font-weight: bold; margin-bottom: 4px;">Nota 2:</label>
    <input type="number" [(ngModel)]="n2" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" min="0" max="10">
  </div>

  <!-- Campo Nota 3 -->
  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold; margin-bottom: 4px;">Nota 3:</label>
    <input type="number" [(ngModel)]="n3" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" min="0" max="10">
  </div>

 
@if (mensagemErro) {

    <div style="color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #f5c6cb;">
      {{ mensagemErro }}
    </div>
  }

  <!-- Botões de Ação -->
  <div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <button (click)="calcularMedia()" style="flex: 1; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
      Calcular
    </button>
    <button (click)="limparFormulario()" style="flex: 1; padding: 10px; background-color: #6c757d; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
      Limpar
    </button>
  </div>

  <!-- Área de Resultado -->
@if (exibirResultado) {

    <div style="border-top: 2px solid #eee; padding-top: 15px;">
      <h3>Resultado Final</h3>
      <p><strong>Aluno:</strong> {{ nome }}</p>
      <p><strong>Média Final:</strong> {{ mediaFinal | number:'1.1-1' }}</p>
      <p>
        <strong>Situação:</strong> 
        <span [style.color]="corSituacao" style="font-weight: bold; padding: 2px 6px; border-radius: 4px;">
          {{ situacao }}
        </span>
      </p>
    </div>
  }
</div>
